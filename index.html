<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive - Shared Workspace</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header { text-align: center; margin-bottom: 30px; }
        h1 { color: #4285F4; margin-bottom: 5px; }
        .notice { color: #888; font-size: 14px; }
        .grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 900px;
        }
        .card {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            width: 160px;
            border: 1px solid #444;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover { 
            border-color: #4285F4; 
            transform: translateY(-2px);
        }
        .game-container {
            display: none;
            margin-top: 30px;
            width: 100%;
            max-width: 900px;
            height: 650px;
            background: #000;
            border: 2px solid #4285F4;
            border-radius: 8px;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Workspace Directory</h1>
        <p class="notice">Select an assigned workspace module below. Press <strong>"P"</strong> at any time to Cloak Screen.</p>
    </div>

    <div class="grid">
        <!-- Game 1: Infinite Craft (Clean Web Engine) -->
        <div class="card" onclick="loadGame('https://infinitecraft.org')">
            <h3>Workspace 101</h3>
            <p style="font-size: 12px; color:#aaa;">(Infinite Craft)</p>
        </div>
        <!-- Game 2: Poki Mirror (Direct Web Port) -->
        <div class="card" onclick="loadGame('https://poki.github.io/')">
            <h3>Workspace 102</h3>
            <p style="font-size: 12px; color:#aaa;">(Poki App Framework)</p>
        </div>
        <!-- Game 3: Coolmath Games Emulator -->
        <div class="card" onclick="loadGame('https://coolmath-games.github.io/')">
            <h3>Workspace 103</h3>
            <p style="font-size: 12px; color:#aaa;">(Coolmath Core)</p>
        </div>
        <!-- Game 4: Geometry Dash (Clean HTML5 Port) -->
        <div class="card" onclick="loadGame('https://github.io')">
            <h3>Workspace 104</h3>
            <p style="font-size: 12px; color:#aaa;">(Geometry Dash)</p>
        </div>
        <!-- Game 5: Retro Bowl -->
        <div class="card" onclick="loadGame('https://github.io')">
            <h3>Workspace 105</h3>
            <p style="font-size: 12px; color:#aaa;">(Retro Bowl)</p>
        </div>
        <!-- Game 6: Basket Random -->
        <div class="card" onclick="loadGame('https://github.io')">
            <h3>Workspace 106</h3>
            <p style="font-size: 12px; color:#aaa;">(Basket Random)</p>
        </div>
    </div>

    <div class="game-container" id="gameBox">
        <iframe id="gameFrame" src=""></iframe>
    </div>

    <script>
        function loadGame(url) {
            document.getElementById('gameBox').style.display = 'block';
            document.getElementById('gameFrame').src = url;
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        // Emergency Panic Switch
        document.addEventListener('keydown', function(event) {
            if (event.key === 'p' || event.key === 'P') {
                window.location.href = 'https://google.com';
            }
        });
    </script>

</body>
</html>
